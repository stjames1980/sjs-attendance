<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1E3A8A">
<meta name="description" content="St. James H.S. School attendance register — AM/PM marking, dashboard, fines.">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>SJS Attendance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: one-column phone app — sticky header, scrolling view, fixed bottom tab bar. */
:root{
  --bg:#F3F5F9; --surface:#FFFFFF; --sunk:#E8ECF3; --line:#D6DCE6;
  --ink:#14213D; --muted:#5B6782; --navy:#1E3A8A; --navy-ink:#FFFFFF;
  --present:#15803D; --present-bg:#DCFCE7; --absent:#DC2626; --absent-bg:#FEE2E2;
  --leave:#2563EB; --leave-bg:#DBEAFE; --half:#B45309; --half-bg:#FEF3C7;
  --gold:#F5C542;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"Figtree", "Segoe UI", system-ui, sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1424; --surface:#172036; --sunk:#1F2A44; --line:#2C3A5A;
  --ink:#E8EDF7; --muted:#9AA7C2; --navy:#3B5BCC; --navy-ink:#FFFFFF;
  --present:#4ADE80; --present-bg:#143524; --absent:#F87171; --absent-bg:#3D1717;
  --leave:#7AA7FF; --leave-bg:#18294D; --half:#FBBF24; --half-bg:#3A2B0F; --gold:#F5C542;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1424; --surface:#172036; --sunk:#1F2A44; --line:#2C3A5A;
  --ink:#E8EDF7; --muted:#9AA7C2; --navy:#3B5BCC; --navy-ink:#FFFFFF;
  --present:#4ADE80; --present-bg:#143524; --absent:#F87171; --absent-bg:#3D1717;
  --leave:#7AA7FF; --leave-bg:#18294D; --half:#FBBF24; --half-bg:#3A2B0F; --gold:#F5C542;
  color-scheme:dark}
html,body{height:100%}
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px)}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--navy)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--navy);color:var(--navy-ink)}
header.top .wrap{padding-block:12px 14px;display:flex;align-items:center;gap:12px}
.crest{width:44px;height:44px;border-radius:50%;background:#fff;display:grid;place-items:center;flex:none;overflow:hidden;box-shadow:0 0 0 2px rgba(255,255,255,.6)}.crest img{width:100%;height:100%;object-fit:contain}
.top h1{font-family:var(--f-display);font-weight:800;font-size:18px;margin:0;line-height:1.1;letter-spacing:.2px}
.top .sub{font-size:12px;opacity:.85;margin-top:2px}
.top .grow{flex:1;min-width:0}
.classbtn{margin-top:4px;border:0;background:rgba(255,255,255,.16);color:var(--navy-ink);border-radius:99px;padding:4px 10px;font-size:12.5px;font-weight:700;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.classlist .stu[aria-current="true"]{border-color:var(--navy);border-width:2px}
.pill-ro{font-size:11px;background:rgba(255,255,255,.18);padding:4px 8px;border-radius:99px;white-space:nowrap}
main{padding-bottom:calc(150px + env(safe-area-inset-bottom,0px))}
main .wrap{padding-block:14px;display:flex;flex-direction:column;gap:14px}
main .wrap>*{min-width:0;max-width:100%}
.card{min-width:0}
.monthchips{max-width:100%}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .wrap{display:grid;grid-template-columns:repeat(5,1fr);padding-block:6px}
nav.tabs button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;font-size:11.5px;font-weight:600;color:var(--muted);border-radius:10px}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-current="page"]{color:var(--navy);background:var(--sunk)}
:root[data-theme="dark"] nav.tabs button[aria-current="page"]{color:var(--ink)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) nav.tabs button[aria-current="page"]{color:var(--ink)}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.label{font-size:11.5px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--muted)}
h2{font-family:var(--f-display);font-weight:800;font-size:20px;margin:0;text-wrap:balance}
h3{font-family:var(--f-display);font-weight:600;font-size:16px;margin:0}
.datebar{display:grid;grid-template-columns:44px 1fr 44px;gap:8px;align-items:center}
.iconbtn{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center}
.iconbtn svg{width:20px;height:20px}
.datebox{position:relative;text-align:center;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:6px 8px}
.datebox .d{font-family:var(--f-display);font-weight:800;font-size:19px}
.datebox input{position:absolute;inset:0;opacity:0;width:100%;height:100%}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--sunk);border-radius:12px;padding:4px;gap:4px}
.seg button{border:0;background:none;border-radius:9px;padding:10px;font-weight:700;display:flex;justify-content:center;gap:8px;align-items:center}
.seg button[aria-pressed="true"]{background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--line);display:inline-block}
.dot.on{background:var(--present)}
.banner{border-radius:12px;padding:12px 14px;font-weight:600;font-size:14px}
.banner.off{background:var(--sunk);color:var(--muted)}
.banner.warn{background:var(--half-bg);color:var(--half)}
.tally{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tally div{border-radius:12px;padding:8px 10px;text-align:center}
.tally b{display:block;font-family:var(--f-display);font-size:22px;font-variant-numeric:tabular-nums}
.tally span{font-size:12px;font-weight:600}
.t-p{background:var(--present-bg);color:var(--present)}
.t-a{background:var(--absent-bg);color:var(--absent)}
.t-l{background:var(--leave-bg);color:var(--leave)}
.search{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 12px}
.quick{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:8px 12px;font-size:13px;font-weight:600}
.chip[aria-pressed="true"]{background:var(--navy);color:var(--navy-ink);border-color:var(--navy)}
.list{display:flex;flex-direction:column;gap:8px}
.stu{display:grid;grid-template-columns:40px 1fr auto;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;text-align:left;width:100%}
.roll{width:40px;height:40px;border-radius:50%;background:var(--sunk);display:grid;place-items:center;font-weight:700;font-variant-numeric:tabular-nums;font-size:14px}
.stu .nm{font-weight:600;min-width:0;overflow-wrap:anywhere}
.stu .meta{font-size:12px;color:var(--muted)}
.mark{min-width:86px;text-align:center;border-radius:10px;padding:8px 6px;font-weight:800;font-size:13px;letter-spacing:.3px}
.m-P{background:var(--present-bg);color:var(--present)}
.m-A{background:var(--absent);color:#fff}
.m-L{background:var(--leave);color:#fff}
.stu.is-A{border-color:var(--absent)}
.stu.is-L{border-color:var(--leave)}
.stu:disabled{opacity:.55;cursor:default}
.savebar{position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom,0px));z-index:24}
.savebar .wrap{padding-block:8px}
.savebtn{width:100%;border:0;border-radius:14px;padding:14px;background:var(--present);color:#fff;font-weight:800;font-size:16px;box-shadow:0 6px 18px rgba(0,0,0,.18)}
.savebtn.dirty{background:var(--absent)}
.savebtn:disabled{opacity:.6}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.kpi b{display:block;font-family:var(--f-display);font-weight:800;font-size:26px;font-variant-numeric:tabular-nums;margin-top:2px}
.kpi .small{margin-top:2px}
.k-bad b{color:var(--absent)} .k-good b{color:var(--present)} .k-gold b{color:var(--half)}
.monthchips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.monthchips .chip{flex:none}
.bars{display:flex;align-items:flex-end;gap:3px;height:110px;padding-top:8px}
.bars i{flex:1;background:var(--navy);border-radius:3px 3px 0 0;min-height:2px;position:relative}
.bars i.off{background:var(--sunk)}
.bars i.low{background:var(--absent)}
.barlbl{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:4px;font-variant-numeric:tabular-nums}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:right;font-size:13.5px}
th:first-child,td:first-child{text-align:left}
th{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
.tablewrap{overflow-x:auto}
.pct-low{color:var(--absent);font-weight:700}
.btn{border:0;border-radius:12px;padding:12px 14px;font-weight:700;background:var(--navy);color:var(--navy-ink)}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.green{background:var(--present);color:#fff}
.btn.sm{padding:8px 12px;font-size:13px;border-radius:10px}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.field{display:flex;flex-direction:column;gap:5px}
.field input,.field select{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 11px}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.field{min-width:0}
.field input,.field select{width:100%;min-width:0}
.sheet{position:fixed;inset:0;z-index:40;background:rgba(10,15,30,.5);display:flex;align-items:flex-end}
.sheet .panel{background:var(--bg);width:100%;max-height:88%;overflow:auto;border-radius:20px 20px 0 0;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.sheet .panel .wrap{padding-block:16px;display:flex;flex-direction:column;gap:12px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(140px + env(safe-area-inset-bottom,0px));z-index:50;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;font-weight:600;font-size:14px;max-width:calc(100% - 32px)}
.empty{text-align:center;padding:28px 16px;color:var(--muted)}
.paid{background:var(--present-bg);color:var(--present);border-radius:99px;padding:6px 10px;font-weight:700;font-size:12.5px;border:0}
.due{background:var(--absent-bg);color:var(--absent);border-radius:99px;padding:6px 10px;font-weight:700;font-size:12.5px;border:0}
.hol{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
textarea.out{width:100%;min-height:120px;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:10px;font-size:13px}
@media (prefers-reduced-motion: no-preference){.stu,.mark,.chip,.seg button{transition:background .15s,border-color .15s,color .15s}}
@media (min-width:560px){.kpis{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <div class="crest" aria-hidden="true"><img src="logo.png" alt=""></div>
    <div class="grow">
      <h1 id="hdrSchool">St. James H.S. School</h1>
      <button class="classbtn" id="hdrSub" aria-label="Switch class">Attendance Register</button>
    </div>
    <span class="pill-ro" id="roPill" hidden>View only</span>
  </div>
</header>

<main><div class="wrap" id="view"><div class="empty">Loading the register…</div></div></main>

<div class="savebar" id="savebar" hidden><div class="wrap"><button class="savebtn" id="saveBtn">Save</button></div></div>

<nav class="tabs" aria-label="Sections"><div class="wrap">
  <button data-tab="mark" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>Mark</button>
  <button data-tab="dash"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 3v18h18"/><path d="M7 15v3M12 10v8M17 6v12"/></svg>Dashboard</button>
  <button data-tab="students"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="9" cy="8" r="4"/><path d="M2 21c0-4 3-6 7-6s7 2 7 6"/><path d="M16 4a4 4 0 0 1 0 8M22 21c0-3-2-5-4-5.5"/></svg>Students</button>
  <button data-tab="fines"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="2" y="6" width="20" height="13" rx="2"/><path d="M2 10h20M6 15h4"/></svg>Fines</button>
  <button data-tab="more"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>More</button>
</div></nav>

<div id="sheetHost"></div>
<div class="toast" id="toast" hidden></div>

<script>
(() => {
"use strict";
// ---------- state ----------
const S = {
  db: null, dl: null, canWrite: true, ready: false,
  cfg: null, students: [], att: {}, pay: {},
  tab: "mark", date: todayISO(), session: new Date().getHours() < 12 ? "AM" : "PM",
  draft: null, draftKey: "", dirty: false, search: "",
  month: todayISO().slice(0, 7), lowScope: "month", fineMonth: todayISO().slice(0, 7), saving: false,
  cid: null, classes: [], unsub: [], got: {}
};
function P(coll){return "c/"+S.cid+"/"+coll}
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function classLabel(k){return k?("Class "+(k.cls||"–")+(k.section?" - "+k.section:"")):""}
const DEF = {
  school: "St. James H.S. School", address: "", cls: "", section: "", teacher: "", principal: "", year: "",
  start: "2026-04-01", end: "2027-03-31", countFrom: "2026-04-01", minPct: 0.75, sunOff: true,
  satOff: "None", fineA: 10, fineHD: 20, fineL: 0, holidays: []
};
const SAT_OPTS = ["None", "All Saturdays", "1st Saturday", "2nd Saturday", "2nd & 4th Saturday", "1st & 3rd Saturday"];
const MN = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const DN = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];

// ---------- helpers ----------
function pad(n){return String(n).padStart(2,"0")}
function todayISO(){const d=new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function toD(iso){const [y,m,d]=iso.split("-").map(Number);return new Date(y,m-1,d)}
function iso(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function addDays(s,n){const d=toD(s);d.setDate(d.getDate()+n);return iso(d)}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function fmtDate(s){const d=toD(s);return DN[d.getDay()]+", "+d.getDate()+" "+MN[d.getMonth()]+" "+d.getFullYear()}
function monthLabel(ym){const [y,m]=ym.split("-").map(Number);return MN[m-1]+" "+y}
function pct(x){return x==null?"–":(x*100).toFixed(1)+"%"}
function C(){const k=S.classes.find(x=>x.id===S.cid)||{};return Object.assign({},DEF,S.cfg||{},{cls:k.cls||"",section:k.section||"",teacher:k.teacher||""})}
function months(){const c=C();const out=[];let d=toD(c.start);d.setDate(1);for(let i=0;i<12;i++){out.push(d.getFullYear()+"-"+pad(d.getMonth()+1));d.setMonth(d.getMonth()+1)}return out}
function daysIn(ym){const [y,m]=ym.split("-").map(Number);return new Date(y,m,0).getDate()}
function holidayName(s){const c=C();for(const h of c.holidays||[]){if(!h.from)continue;const to=h.to||h.from;if(s>=h.from&&s<=to)return h.name||"Holiday"}return null}
function status(s){
  const c=C();
  if(s<c.start||s>c.end) return "OUT";
  if(holidayName(s)) return "HOL";
  const d=toD(s),wd=d.getDay(),n=Math.floor((d.getDate()-1)/7);
  if(wd===0&&c.sunOff) return "OFF";
  if(wd===6){const o=c.satOff;
    if(o==="All Saturdays"||(o==="1st Saturday"&&n===0)||(o==="2nd Saturday"&&n===1)||(o==="2nd & 4th Saturday"&&(n===1||n===3))||(o==="1st & 3rd Saturday"&&(n===0||n===2))) return "OFF";}
  if(s<c.countFrom) return "PRE";
  if(s>todayISO()) return "FUT";
  return "W";
}
function workDays(ym){const out=[];for(let d=1;d<=daysIn(ym);d++){const s=ym+"-"+pad(d);if(status(s)==="W")out.push(s)}return out}
function codeOf(s,ses,roll){const a=S.att[s];return (a&&a[ses]&&a[ses][roll])||"P"}
function statsFor(roll,ym){
  const wd=workDays(ym);let full=0,half=0,lses=0;
  for(const s of wd){const am=codeOf(s,"AM",roll),pm=codeOf(s,"PM",roll);
    const a=(am==="A")+(pm==="A");if(a===2)full++;else if(a===1)half++;
    lses+=(am==="L")+(pm==="L");}
  const c=C(),ldays=lses/2,W=wd.length;
  const present=W-full-0.5*half-ldays;
  return {W,full,half,ldays,present,pct:W?present/W:null,fine:full*c.fineA+half*c.fineHD+ldays*c.fineL};
}
function sessionStats(roll){let t={W:0,full:0,half:0,ldays:0,present:0,fine:0};for(const ym of months()){const x=statsFor(roll,ym);for(const k in t)t[k]+=x[k]}t.pct=t.W?t.present/t.W:null;return t}
function classMonth(ym){
  const rows=S.students.map(st=>({st,x:statsFor(st.roll,ym)}));
  const W=workDays(ym).length,N=rows.length;
  const sumP=rows.reduce((a,r)=>a+r.x.present,0);
  return {rows,W,N,avg:W&&N?sumP/(W*N):null,
    full:rows.reduce((a,r)=>a+r.x.full,0),half:rows.reduce((a,r)=>a+r.x.half,0),ldays:rows.reduce((a,r)=>a+r.x.ldays,0),
    fine:rows.reduce((a,r)=>a+r.x.fine,0),below:rows.filter(r=>r.x.pct!=null&&r.x.pct<C().minPct),perfect:rows.filter(r=>r.x.pct===1).length};
}
function daysNeeded(present,W,m){if(W===0||present/W>=m||m>=1)return 0;return Math.ceil((m*W-present)/(1-m))}

}

function cycle(roll){const order={P:"A",A:"L",L:"P"};const n=order[draftCode(roll)];if(n==="P")delete S.draft[roll];else S.draft[roll]=n;S.dirty=true}
async function saveDraft(){
  if(!S.db){toast("Saving isn't available in this view");return}
  S.saving=true;render();
  const cur=S.att[S.date]||{};
  const body={AM:cur.AM||{},PM:cur.PM||{},takenAM:!!cur.takenAM,takenPM:!!cur.takenPM};
  body[S.session]=Object.assign({},S.draft);body["taken"+S.session]=true;body.savedAt=new Date().toISOString();
  try{await S.db.doc(P("att")+"/"+S.date).set(body);S.att[S.date]=body;S.dirty=false;toast(S.session+" attendance saved for "+fmtDate(S.date))}
  catch(e){toast(e&&e.code==="invalid_argument"?"You have view-only access":"Couldn't save. Check your connection and try again.")}

function bulkStudents(){
  openSheet(`<h2>Paste student list</h2><p class="small muted">One student per line. Use either just the name, or <b>Roll, Adm. no, Name</b> (copied from Excel works too). Students without a roll number are numbered after the last roll.</p>
  <textarea class="out" id="bulkTxt" placeholder="1, AD-01, Abraham Debbarma&#10;2, AD-02, Adrick Molsom&#10;or just:&#10;Abraham Debbarma"></textarea>
  <div class="btns"><button class="btn green" id="bulkGo">Add students</button><button class="btn ghost" data-close>Cancel</button></div>`);
  document.getElementById("bulkGo").onclick=async e=>{
    const lines=document.getElementById("bulkTxt").value.split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
    if(!lines.length){toast("Paste at least one name");return}
    let next=S.students.reduce((a,s)=>Math.max(a,s.roll),0)+1;const taken=new Set(S.students.map(s=>s.roll));const out=[];
    for(const l of lines){const parts=l.split(/\t|,/).map(x=>x.trim()).filter(x=>x!=="");
      let roll=null,adm="",name="";
      if(parts.length>=3&&/^\d+$/.test(parts[0])){roll=+parts[0];adm=parts[1];name=parts.slice(2).join(" ")}
      else if(parts.length===2&&/^\d+$/.test(parts[0])){roll=+parts[0];name=parts[1]}
      else name=parts.join(" ");
      if(!name)continue;if(!roll||taken.has(roll)){while(taken.has(next))next++;roll=next}
      taken.add(roll);out.push({roll,adm,name,gender:"",parent:"",phone:""})}
    e.target.disabled=true;let n=0;
    for(const s of out){e.target.textContent=`Adding ${++n} of ${out.length}…`;
      try{await S.db.doc(P("students")+"/r"+String(s.roll).padStart(3,"0")).set(s)}catch(err){toast("Stopped: couldn't save "+s.name);e.target.disabled=false;return}}
    closeSheet();toast(out.length+" students added");
  };
}

// ---------- storage: this phone (localStorage) or online (Firebase) ----------
const LS_KEY="sjs-data-v1", FB_KEY="sjs-firebase-config";
function snapDoc(path,d){return {id:path.split("/").pop(),exists:d!==undefined,data:()=>d}}
function parentOf(p){return p.split("/").slice(0,-1).join("/")}
class LocalStore{
  constructor(){this.dl={};this.cl={};try{this.data=JSON.parse(localStorage.getItem(LS_KEY)||"{}")}catch(e){this.data={}}}
  save(){try{localStorage.setItem(LS_KEY,JSON.stringify(this.data));return true}catch(e){toast("Phone storage is full or blocked. Download a backup.");return false}}
  q(cp){return {docs:Object.keys(this.data).filter(k=>k.startsWith(cp+"/")&&!k.slice(cp.length+1).includes("/")).sort().map(k=>snapDoc(k,this.data[k]))}}
  doc(path){const self=this;return {path,id:path.split("/").pop(),
    get:async()=>snapDoc(path,self.data[path]),
    set:async d=>{self.data[path]=JSON.parse(JSON.stringify(d));self.save();self.emit([path])},
    delete:async()=>{delete self.data[path];self.save();self.emit([path])},
    onSnapshot(cb){(self.dl[path]=self.dl[path]||[]).push(cb);setTimeout(()=>cb(snapDoc(path,self.data[path])));return()=>{self.dl[path]=(self.dl[path]||[]).filter(x=>x!==cb)}}}}
  collection(cp){const self=this;return {path:cp,doc:id=>self.doc(cp+"/"+id),get:async()=>self.q(cp),
    onSnapshot(cb){(self.cl[cp]=self.cl[cp]||[]).push(cb);setTimeout(()=>cb(self.q(cp)));return()=>{self.cl[cp]=(self.cl[cp]||[]).filter(x=>x!==cb)}}}}
  emit(paths){const cols=new Set();for(const p of paths){cols.add(parentOf(p));(this.dl[p]||[]).forEach(cb=>setTimeout(()=>cb(snapDoc(p,this.data[p]))))}
    cols.forEach(cp=>(this.cl[cp]||[]).forEach(cb=>setTimeout(()=>cb(this.q(cp)))))}
  async writeMany(list){for(const [p,d] of list){if(d===null)delete this.data[p];else this.data[p]=JSON.parse(JSON.stringify(d))}this.save();this.emit(list.map(x=>x[0]))}
}
class FbStore{
  constructor(fs){this.fs=fs}
  fire(pr){pr.catch(e=>toast("Online sync failed: "+(e&&e.message||"check your connection")));return Promise.resolve()}
  doc(p){const ref=this.fs.doc(p),self=this;return {path:p,id:ref.id,get:()=>ref.get(),set:d=>self.fire(ref.set(d)),delete:()=>self.fire(ref.delete()),onSnapshot:(n,e)=>ref.onSnapshot(n,e)}}
  collection(p){const col=this.fs.collection(p),self=this;return {path:p,doc:id=>self.doc(p+"/"+id),get:()=>col.get(),onSnapshot:(n,e)=>col.onSnapshot(n,e)}}
  async writeMany(list){for(let i=0;i<list.length;i+=400){const b=this.fs.batch();list.slice(i,i+400).forEach(([p,d])=>d===null?b.delete(this.fs.doc(p)):b.set(this.fs.doc(p),d));this.fire(b.commit())}}
}
function fbConfig(){try{return JSON.parse(localStorage.getItem(FB_KEY)||"null")}catch(e){return null}}
function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement("script");s.src=src;s.onload=res;s.onerror=()=>rej(new Error("Couldn't load "+src));document.head.appendChild(s)})}
function saveFile(name,text,mime){const b=new Blob([text],{type:mime||"text/plain"});const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500)}
function pickFile(accept){return new Promise(res=>{const i=document.createElement("input");i.type="file";i.accept=accept;i.onchange=()=>res(i.files[0]||null);i.click()})}

async function exportAll(store){

// ---------- import from the Excel register ----------
function serialToISO(n){const d=new Date(Date.UTC(1899,11,30)+Math.round(n)*864e5);return d.getUTCFullYear()+"-"+pad(d.getUTCMonth()+1)+"-"+pad(d.getUTCDate())}
function cellISO(c){if(!c)return "";if(c.t==="n")return serialToISO(c.v);if(c.t==="d"&&c.v instanceof Date)return iso(c.v);
  const m=String(c.v||"").match(/^(\d{4})-(\d{2})-(\d{2})/);return m?m[0]:""}
async function parseRegister(file){
  if(!window.XLSX)await loadScript("https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js");
  const wb=XLSX.read(await file.arrayBuffer(),{type:"array"});
  const sh=n=>wb.Sheets[n];const val=(ws,a)=>ws&&ws[a]?ws[a].v:undefined;const txt=(ws,a)=>{const v=val(ws,a);return v==null?"":String(v).trim()};
  const st=sh("Settings"),stu=sh("Students");
  if(!st||!stu)throw new Error("This isn't the SJS Attendance Register workbook (Settings and Students sheets not found).");
  const cfg={school:txt(st,"C5"),address:txt(st,"C6"),affiliation:txt(st,"C7"),motto:txt(st,"C8"),year:txt(st,"C14"),
    principal:txt(st,"B15")==="Principal"?txt(st,"C15"):"",start:cellISO(st.C17)||DEF.start,end:cellISO(st.C18)||DEF.end,countFrom:cellISO(st.C19)||cellISO(st.C17)||DEF.countFrom,
    minPct:+val(st,"C21")||0.75,sunOff:txt(st,"C22")!=="No",satOff:SAT_OPTS.includes(txt(st,"C23"))?txt(st,"C23"):"None",holidays:[]};
  for(let r=34;r<=103;r++){const f=cellISO(st["C"+r]);if(f)cfg.holidays.push({name:txt(st,"B"+r)||"Holiday",from:f,to:cellISO(st["D"+r])})}
  const fn=sh("Fines");if(fn){cfg.fineA=+val(fn,"E7")||0;cfg.fineHD=+val(fn,"E8")||0;cfg.fineL=+val(fn,"E9")||0}
  const klass={cls:txt(st,"C11"),section:txt(st,"C12"),teacher:txt(st,"C13")};
  const students=[];
  for(let r=7;r<=66;r++){const name=txt(stu,"D"+r);if(!name)continue;
    students.push({roll:+val(stu,"B"+r)||students.length+1,adm:txt(stu,"C"+r),name:name.replace(/\s+/g," "),gender:txt(stu,"E"+r),parent:txt(stu,"F"+r),phone:txt(stu,"G"+r),_i:r-7})}
  // month sheets
  const MS=["Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec","Jan","Feb","Mar"];
  const start=toD(cfg.start);start.setDate(1);const att={};let marks=0;
  MS.forEach((m,i)=>{const ws=sh(m);if(!ws||!ws["!ref"])return;
    const d0=new Date(start.getFullYear(),start.getMonth()+i,1),ym=d0.getFullYear()+"-"+pad(d0.getMonth()+1);
    const two=XLSX.utils.decode_range(ws["!ref"]).e.c>=63;
    students.forEach(s=>{const r=9+s._i;
      for(let d=1;d<=31;d++){const day=ym+"-"+pad(d);
        const get=c=>{const a=XLSX.utils.encode_cell({r:r-1,c});const v=ws[a]?String(ws[a].v).trim().toUpperCase():"";return v};
        let am,pm;
        if(two){am=get(2+2*(d-1));pm=get(3+2*(d-1))}else{const v=get(2+(d-1));if(v==="HD"){am="A";pm=""}else{am=v;pm=v}}
        for(const [ses,code] of [["AM",am],["PM",pm]]){if(code==="A"||code==="L"){const a=att[day]=att[day]||{AM:{},PM:{},takenAM:true,takenPM:true};a[ses][String(s.roll)]=code;marks++}}
      }});
  });
  const pay={};let pays=0;const fc=sh("Fine Collection");
  if(fc){students.forEach(s=>{for(let i=0;i<12;i++){const c=fc[XLSX.utils.encode_cell({r:12+s._i,c:2+i})];if(!c||c.v===""||c.v==null)continue;
    const d0=new Date(start.getFullYear(),start.getMonth()+i,1),ym=d0.getFullYear()+"-"+pad(d0.getMonth()+1);
    (pay[ym]=pay[ym]||{})[String(s.roll)]=cellISO(c)||todayISO();pays++}})}
  return {cfg,klass,students,att,pay,marks,pays};
}
async function importRegister(){
  const file=await pickFile(".xlsx,.xlsm");if(!file)return;
  let R;try{toast("Reading "+file.name+"…");R=await parseRegister(file)}catch(e){toast(e.message||"Couldn't read that file");return}
  const ex=S.classes.find(x=>x.cls.toLowerCase()===R.klass.cls.toLowerCase()&&(x.section||"").toLowerCase()===R.klass.section.toLowerCase());
  openSheet(`<h2>Import from Excel</h2>

  <div class="small muted" style="margin-top:6px">${R.students.length} students • ${Object.keys(R.att).length} days with absences/leave (${R.marks} marks) • ${R.pays} fine payments • ${R.cfg.holidays.length} holidays</div></div>
  ${ex?`<div class="banner warn">${esc(classLabel(ex))} is already in the app. Students and marks from the file will replace the same rolls and dates.</div>`:""}
  <label class="row small"><input type="checkbox" id="impCfg" checked> Also update school settings (fines, holidays, Saturdays, Principal)</label>
  <div class="btns"><button class="btn green" id="impGo">Import</button><button class="btn ghost" data-close>Cancel</button></div>`);
  document.getElementById("impGo").onclick=async()=>{
    let id=ex?ex.id:(R.klass.cls+(R.klass.section?"-"+R.klass.section:"")).replace(/[^A-Za-z0-9_\-]/g,"").slice(0,40)||"class";
    if(!ex){let b=id,i=2;while(S.classes.some(x=>x.id===id))id=b+"-"+(i++)}
    const list=[["classes/"+id,{id,cls:R.klass.cls||"?",section:R.klass.section,teacher:R.klass.teacher,order:ex?(ex.order||0):Date.now()}]];
    if(document.getElementById("impCfg").checked)list.push(["cfg/main",Object.assign({},DEF,S.cfg||{},R.cfg)]);
    R.students.forEach(s=>{const o=Object.assign({},s);delete o._i;list.push(["c/"+id+"/students/r"+String(s.roll).padStart(3,"0"),o])});
    Object.entries(R.att).forEach(([d,a])=>list.push(["c/"+id+"/att/"+d,a]));
    Object.entries(R.pay).forEach(([ym,p])=>list.push(["c/"+id+"/pay/"+ym,Object.assign({},(ex&&S.cid===id&&S.pay[ym])||{},p)]));
    await S.db.writeMany(list);closeSheet();attachClass(id);S.tab="dash";S.month=todayISO().slice(0,7);toast("Imported "+classLabel(R.klass));
  };
}

function startData(store){

async function boot(){
  const cfg=fbConfig();
  if(!cfg){startData(S.local);return}
  S.mode="online";
  try{
    const b="https://www.gstatic.com/firebasejs/10.12.2/";
    await loadScript(b+"firebase-app-compat.js");await loadScript(b+"firebase-auth-compat.js");await loadScript(b+"firebase-firestore-compat.js");
    if(!firebase.apps.length)firebase.initializeApp(cfg);
    const fs=firebase.firestore();try{await fs.enablePersistence({synchronizeTabs:true})}catch(e){}
    S.fs=fs;
    firebase.auth().onAuthStateChanged(u=>{S.user=u;if(u){startData(new FbStore(fs))}else{stopData();S.ready=true;render()}});
  }catch(e){

  }
}

  v.innerHTML=`<div class="card"><h2>Sign in</h2><p class="small muted">Online sync is on. Sign in with the email and password your school admin created for you.</p>
  <form id="loginF" style="display:flex;flex-direction:column;gap:10px;margin-top:8px">
  <label class="field"><span class="label">Email</span><input id="lE" type="email" autocomplete="username" required></label>
  <label class="field"><span class="label">Password</span><input id="lP" type="password" autocomplete="current-password" required></label>
  <button class="btn" id="lGo" type="submit">Sign in</button><p class="small" id="lErr" style="color:var(--absent);margin:0"></p></form></div>
  <div class="card"><h3>Use without online sync</h3><p class="small muted">Turns online sync off on this phone. Attendance will be saved on this phone only.</p><button class="btn ghost" id="lOff">Turn off online sync</button></div>`;
  v.querySelector("#loginF").onsubmit=async e=>{e.preventDefault();const err=v.querySelector("#lErr");err.textContent="";v.querySelector("#lGo").disabled=true;
    try{await firebase.auth().signInWithEmailAndPassword(v.querySelector("#lE").value.trim(),v.querySelector("#lP").value)}
    catch(x){err.textContent=/network/i.test(x.code||"")?"No internet connection. Try again when online.":"Wrong email or password.";v.querySelector("#lGo").disabled=false}};
  v.querySelector("#lOff").onclick=()=>{try{localStorage.removeItem(FB_KEY)}catch(e){}location.reload()};
}
function dataCard(){
  const online=S.mode==="online";
  return `<div class="card"><h3>Data &amp; sync</h3>
  <p class="small" style="margin:6px 0 10px">${online?`<b style="color:var(--present)">● Online sync on</b> — signed in as ${esc(S.user&&S.user.email||"")}. Works offline too; changes upload when internet returns.`:`<b>● Saved on this phone only.</b> ${S.syncError?"Online sync is set up but couldn't start (no internet).":"Download a backup now and then."}`}</p>
  <div class="btns"><button class="btn" id="dImp">Import from Excel register</button><button class="btn ghost" id="dBak">Download backup</button><button class="btn ghost" id="dRes">Restore backup</button></div>
  <div class="btns" style="margin-top:8px">${online?`<button class="btn ghost" id="dUp">Upload this phone's data</button><button class="btn ghost" id="dOut">Sign out</button><button class="btn ghost" id="dOff">Turn off online sync</button>`:`<button class="btn ghost" id="dOn">Set up online sync</button>`}</div></div>
  <div class="card"><h3>Install on this phone</h3>
  ${window.matchMedia("(display-mode: standalone)").matches?`<p class="small muted">The app is installed. Open it from your home screen.</p>`:
   S.installEvt?`<p class="small muted">Adds the app to your home screen. It opens full screen and works without internet.</p><button class="btn green" id="dInst">Install app</button>`:
   `<p class="small muted"><b>Android (Chrome):</b> tap the ⋮ menu → <b>Install app</b> or <b>Add to Home screen</b>.<br><b>iPhone (Safari):</b> tap Share → <b>Add to Home Screen</b>.</p>`}</div>`;
}
function wireDataCard(v){
  const on=(id,f)=>{const b=v.querySelector(id);if(b)b.onclick=f};
  on("#dImp",importRegister);
  on("#dBak",async()=>{const d=await exportAll(S.db);saveFile("SJS_Attendance_backup_"+todayISO()+".json",JSON.stringify(d),"application/json");toast("Backup downloaded")});
  on("#dRes",async()=>{const f=await pickFile(".json,application/json");if(!f)return;let d;try{d=JSON.parse(await f.text())}catch(e){toast("That file isn't a backup");return}
    if(!d||d.app!=="sjs-attendance"||!d.docs){toast("That file isn't an SJS Attendance backup");return}
    const n=Object.keys(d.docs).length;
    openSheet(`<h2>Restore backup</h2><p>Backup from ${esc((d.exported||"").slice(0,10))} with ${n} records. Records in the backup replace the same records here; nothing else is deleted.</p><div class="btns"><button class="btn green" id="rGo">Restore</button><button class="btn ghost" data-close>Cancel</button></div>`);
    document.getElementById("rGo").onclick=async()=>{await S.db.writeMany(Object.entries(d.docs));closeSheet();toast("Backup restored")}});
  on("#dInst",async()=>{const e=S.installEvt;if(!e)return;e.prompt();try{await e.userChoice}catch(x){}S.installEvt=null;render()});
  on("#dOn",setupSync);
  on("#dOut",()=>firebase.auth().signOut());
  on("#dOff",()=>{try{localStorage.removeItem(FB_KEY)}catch(e){}location.reload()});
  on("#dUp",()=>{const list=Object.entries(S.local.data);if(!list.length){toast("No data saved on this phone");return}
    openSheet(`<h2>Upload this phone's data</h2><p>Copies the ${list.length} records saved on this phone (from before online sync) to the online register. Same classes, rolls and dates are replaced.</p><div class="btns"><button class="btn green" id="uGo">Upload</button><button class="btn ghost" data-close>Cancel</button></div>`);
    document.getElementById("uGo").onclick=async()=>{await S.db.writeMany(list);closeSheet();toast("Uploaded "+list.length+" records")}});
}
function setupSync(){
  openSheet(`<h2>Set up online sync</h2>
  <p class="small">Online sync lets every teacher and the Principal see the same register. It uses a free Google Firebase project — follow the steps in the setup guide, then paste the <b>firebaseConfig</b> here (the whole block is fine).</p>
  <textarea class="out" id="fbTxt" placeholder='const firebaseConfig = {&#10;  apiKey: "...",&#10;  authDomain: "...",&#10;  projectId: "...",&#10;  ...&#10;};'></textarea>
  <p class="small muted">Tip: after signing in, use “Upload this phone's data” to copy what you already marked on this phone.</p>
  <div class="btns"><button class="btn green" id="fbGo">Save and turn on</button><button class="btn ghost" data-close>Cancel</button></div>`);
  document.getElementById("fbGo").onclick=()=>{
    const raw=document.getElementById("fbTxt").value;const m=raw.match(/\{[\s\S]*\}/);
    let cfg=null;if(m){try{cfg=JSON.parse(m[0].replace(/([{,]\s*)([A-Za-z_][A-Za-z0-9_]*)\s*:/g,'$1"$2":').replace(/'/g,'"').replace(/,\s*}/g,"}"))}catch(e){}}
    if(!cfg||!cfg.apiKey||!cfg.projectId){toast("That doesn't look like a firebaseConfig — it needs apiKey and projectId");return}
    try{localStorage.setItem(FB_KEY,JSON.stringify(cfg))}catch(e){toast("Couldn't save on this phone");return}
    location.reload();
  };
}
if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))}
boot();

})();
</script>
